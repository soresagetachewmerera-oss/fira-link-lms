name: I18n Quality Gate (Bilingual English & Amharic)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  i18n-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Run I18n Key Parity & Amharic Quality Gate
        run: python scripts/check_i18n.py

      - name: Run Hardcoded String Linter
        run: python scripts/lint_hardcoded.py

      - name: Install Flutter Dependencies
        run: |
          cd "Eduex Flutter"
          flutter pub get

      - name: Run Localization Unit Tests
        run: |
          cd "Eduex Flutter"
          flutter test test/localization_test.dart
