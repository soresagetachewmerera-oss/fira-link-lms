<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="description"
    content="Fira Link - The Gateway of African Trade &amp; Excellence. Global B2B Trade, AI Legal Studio, Coffee Safaris, and Industry Summits.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fira Link">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Fira Link</title>
  <title>Fira Link - The Gateway of African Trade &amp; Excellence</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Reset & Base Styles */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0F0B1E;
      font-family: 'Montserrat', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Branded Initial Loading Overlay */
    #fira-loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0F0B1E;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      opacity: 1;
      transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-sizing: border-box;
      padding: 24px;
    }

    #fira-loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* Center Emblem Stack */
    .emblem-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .emblem-container {
      position: relative;
      width: 96px;
      height: 96px;
      border-radius: 24px;
      background: #1E0533;
      border: 1.5px solid rgba(109, 26, 149, 0.40);
      box-shadow: 0 8px 24px rgba(109, 26, 149, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
    }

    .emblem-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Brand Typography */
    .brand-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 3.5px;
      margin: 0 0 8px 0;
      color: #FFFFFF;
      text-align: center;
      text-transform: uppercase;
      font-family: 'Montserrat', sans-serif;
    }

    .tagline {
      font-size: 13px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.70);
      letter-spacing: 0.4px;
      margin: 0 0 28px 0;
      text-align: center;
      font-family: 'Montserrat', sans-serif;
    }

    /* Sleek Indeterminate Loading Bar */
    .loader-track {
      width: 140px;
      height: 3.5px;
      background: rgba(255, 255, 255, 0.10);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .loader-indicator {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 45%;
      background: #8B2BB8;
      border-radius: 999px;
      animation: firaIndeterminate 1.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }

    @keyframes firaIndeterminate {
      0% {
        left: -45%;
        width: 30%;
      }

      50% {
        left: 30%;
        width: 50%;
      }

      100% {
        left: 100%;
        width: 30%;
      }
    }
  </style>
</head>

<body>
  <!-- Fira Link Official Branded Splash / Loading Screen -->
  <div id="fira-loading-screen">
    <div class="emblem-wrapper">
      <div class="emblem-container">
        <img src="icons/Icon-192.png" alt="Fira Link Emblem">
      </div>
    </div>
    <div class="brand-title">FIRA LINK</div>
    <div class="tagline">The Gateway of African Trade &amp; Excellence</div>
    <div class="loader-track">
      <div class="loader-indicator"></div>
    </div>
  </div>

  <script>
    // Fade out splash screen when Flutter engine renders the first frame
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('fira-loading-screen');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(function () {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 500);
      }
    });

    // Fallback safety timeout in case event is missed
    setTimeout(function () {
      var loader = document.getElementById('fira-loading-screen');
      if (loader && !loader.classList.contains('fade-out')) {
        loader.classList.add('fade-out');
        setTimeout(function () {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 500);
      }
    }, 6000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
