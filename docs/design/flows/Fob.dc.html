<style>
body{margin:0;font-family:Montserrat,'Noto Sans Ethiopic',system-ui,sans-serif;color:#1E1B4B}
a{text-decoration:none;color:inherit}
.card{background:#FFFFFF;border:1px solid #E9D5FF;border-radius:22px;box-sizing:border-box}
.t{font-size:14px;font-weight:600}
.d{font-size:12px;line-height:1.5;color:#6B7280}
.pill{display:inline-flex;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:600;white-space:nowrap}
.row{display:flex;align-items:center;gap:12px}
.ph{background:#EFE9F4;color:#4B5563;display:flex;align-items:center;justify-content:center;font-size:11px;flex:none}
.inp{box-sizing:border-box;width:100%;height:52px;border:1px solid #E9D5FF;border-radius:16px;padding:0 16px;font-size:14px;font-family:inherit;color:#1E1B4B;background:#FFFFFF}
.lbl{font-size:13px;font-weight:600;margin:0 0 6px;display:block}

.chip{display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:12px;border:1px solid #E9D5FF;background:#FFFFFF;font-size:13px;font-weight:500;white-space:nowrap;flex:none}
.chip.on{background:#6D1A95;border-color:#6D1A95;color:#FFFFFF}
.ln{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid #F3E8FF;min-height:52px;box-sizing:border-box}

<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div style=""><label class="lbl" for="c5">Transport to port</label><input class="inp" id="c5" type="text" placeholder="[ETB]"></div><div style=""><label class="lbl" for="c6">Export fees and docs</label><input class="inp" id="c6" type="text" placeholder="[ETB]"></div></div>
