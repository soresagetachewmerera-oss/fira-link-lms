<style>
body{margin:0;font-family:Montserrat,'Noto Sans Ethiopic',system-ui,sans-serif;color:#1E1B4B}

<div style="display:flex;flex-direction:column;gap:14px">
<div style=""><label class="lbl" for="r1">What coffee do you need?</label><input class="inp" id="r1" type="text" placeholder="e.g. Washed Sidama Grade 2"></div>

<div><div class="lbl">Incoterm</div><div style="display:flex;gap:8px"><span class="chip on">FOB</span><span class="chip">CIF</span><span class="chip">CFR</span><span class="chip">EXW</span></div></div>
